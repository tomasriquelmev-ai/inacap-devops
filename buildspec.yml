version: 0.2

env:
  variables:
    TF_VERSION: "1.9.5"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Instalando Terraform ${TF_VERSION} en entorno CodeBuild..."
      - curl -s -qL -o terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
      - unzip -o terraform.zip -d /usr/local/bin/
      - terraform --version

  pre_build:
    commands:
      - echo "Fase Pre-Build Ejecutando pruebas automatizadas de IaC y Seguridad..."
      - chmod +x tests/test_infra.sh
      - ./tests/test_infra.sh

  build:
    commands:
      - echo "Fase Build Validando configuracion de infraestructura..."
      - cd infra && terraform init -backend=false && terraform validate

  post_build:
    commands:
      - echo "Fase Post-Build Verificando pruebas funcionales..."
      - if [ -n "$APP_URL" ]; then python3 tests/test_endpoint.py; else echo "APP_URL no definida; validacion estatica y IaC completada con exito."; fi

artifacts:
  files:
    - infra/*.tf
    - tests/*
